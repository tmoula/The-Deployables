name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  HARBOR_REGISTRY: "harbor.javajon-gke.duckdns.org"
  HARBOR_PROJECT: "library"
  GKE_CLUSTER: "deps-lead-svc-cluster" # Replace with your actual cluster name if different
  GKE_ZONE: "us-central1-c"            # Replace with your actual zone
  GKE_NAMESPACE: "deps-lead-svc"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      # --- Auth Service ---
      - name: Build Auth Service JAR
        working-directory: ./apps/auth-svc
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Build and Push Auth Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/auth-svc
          push: true
          tags: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/auth-svc:${{ github.sha }}

      # --- Lead Service ---
      - name: Build Lead Service JAR
        working-directory: ./apps/lead-svc
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Build and Push Lead Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/lead-svc
          push: true
          tags: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/lead-svc:${{ github.sha }}

      # --- Campaign Service ---
      - name: Build Campaign Service JAR
        working-directory: ./apps/campaign-svc
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Build and Push Campaign Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/campaign-svc
          push: true
          tags: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/campaign-svc:${{ github.sha }}

      # --- AI Service ---
      - name: Build and Push AI Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/AI-svc
          file: ./apps/AI-svc/Dockerfile
          push: true
          tags: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/ai-svc:${{ github.sha }}

      # --- Frontend ---
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/outreach-ui:${{ github.sha }}
          build-args: |
            REACT_APP_AUTH_URL=${{ secrets.REACT_APP_AUTH_URL || 'http://localhost:8083/api/v1/auth' }}
            REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL || 'http://localhost:8081/api/v1' }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} --zone ${{ env.GKE_ZONE }}

      - name: Update K8s manifests with new image tags
        run: |
          # Update auth-svc
          sed -i "s|image:.*auth-svc:.*|image: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/auth-svc:${{ github.sha }}|g" infra/k8s/auth-svc-deploy-k8s.yaml
          
          # Update lead-svc
          sed -i "s|image:.*lead-svc:.*|image: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/lead-svc:${{ github.sha }}|g" infra/k8s/lead-deploy-k8s.yaml
          
          # Update campaign-svc (if exists)
          if [ -f "infra/k8s/campaign-svc-deploy-k8s.yaml" ]; then
            sed -i "s|image:.*campaign-svc:.*|image: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/campaign-svc:${{ github.sha }}|g" infra/k8s/campaign-svc-deploy-k8s.yaml
          fi
          
          # Update ai-svc (if exists)
          if [ -f "infra/k8s/ai-svc-deploy-k8s.yaml" ]; then
            sed -i "s|image:.*ai-svc:.*|image: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/ai-svc:${{ github.sha }}|g" infra/k8s/ai-svc-deploy-k8s.yaml
          fi
          
          # Update frontend
          sed -i "s|image:.*outreach-ui:.*|image: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/outreach-ui:${{ github.sha }}|g" infra/k8s/frontend-deploy-k8s.yaml

      - name: Deploy to GKE
        run: |
          cd infra/k8s
          
          # Apply namespace if it doesn't exist
          kubectl apply -f namespace.yaml || true
          
          # Apply ConfigMap and Secrets (assuming they exist)
          kubectl apply -f configmap.yaml || echo "ConfigMap not found, skipping"
          
          # Deploy services
          kubectl apply -f auth-svc-deploy-k8s.yaml
          kubectl apply -f lead-deploy-k8s.yaml
          kubectl apply -f frontend-deploy-k8s.yaml
          
          # Deploy campaign-svc if manifest exists
          if [ -f "campaign-svc-deploy-k8s.yaml" ]; then
            kubectl apply -f campaign-svc-deploy-k8s.yaml
          fi
          
          # Deploy ai-svc if manifest exists
          if [ -f "ai-svc-deploy-k8s.yaml" ]; then
            kubectl apply -f ai-svc-deploy-k8s.yaml
          fi
          
          # Apply ingress
          kubectl apply -f ingress.yaml || echo "Ingress not found, skipping"

      - name: Verify Deployment
        run: |
          echo "Waiting for deployments to be ready..."
          kubectl wait --for=condition=available --timeout=300s deployment/auth-deployment -n ${{ env.GKE_NAMESPACE }} || true
          kubectl wait --for=condition=available --timeout=300s deployment/lead-deployment -n ${{ env.GKE_NAMESPACE }} || true
          kubectl wait --for=condition=available --timeout=300s deployment/frontend-deployment -n ${{ env.GKE_NAMESPACE }} || true
          
          echo "Deployment status:"
          kubectl get pods -n ${{ env.GKE_NAMESPACE }}

