name: CD - Deploy to GKE

on:
  workflow_run:
    workflows: ["CI - Build and Push to Harbor"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch: # Allow manual triggering

env:
  HARBOR_REGISTRY: harbor.javajon.duckdns.org
  HARBOR_PROJECT: deps
  GKE_PROJECT_ID: ${{ secrets.GKE_PROJECT_ID }}
  GKE_CLUSTER_NAME: ${{ secrets.GKE_CLUSTER_NAME }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  KUBECTL_VERSION: "v1.28.0"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GKE_SA_KEY }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER_NAME }} \
            --zone ${{ env.GKE_ZONE }} \
            --project ${{ env.GKE_PROJECT_ID }}
      
      - name: Get latest commit SHA from CI workflow
        id: commit
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            SHA=$(git rev-parse --short HEAD)
          else
            SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          fi
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "Using commit SHA: $SHA"
      
      - name: Create or update Harbor image pull secret
        run: |
          kubectl create secret docker-registry harbor-registry-secret \
            --docker-server=${{ env.HARBOR_REGISTRY }} \
            --docker-username=${{ secrets.HARBOR_USERNAME }} \
            --docker-password=${{ secrets.HARBOR_PASSWORD }} \
            --namespace=deps-lead-svc \
            --dry-run=client -o yaml | kubectl apply -f -
      
      - name: Update image tags in deployment manifests
        run: |
          cd infra/k8s
          
          # Update auth-svc image (handles both old and new registry formats)
          if [ -f "auth-svc-deploy-k8s.yaml" ]; then
            sed -i "s|image:.*auth-svc.*|image: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/auth-svc:${{ steps.commit.outputs.sha }}|g" auth-svc-deploy-k8s.yaml
            echo "✅ Updated auth-svc image tag"
          fi
          
          # Update campaign-svc image (handles both old and new registry formats)
          if [ -f "campaign-svc-deploy-k8s.yaml" ]; then
            sed -i "s|image:.*campaign-svc.*|image: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/campaign-svc:${{ steps.commit.outputs.sha }}|g" campaign-svc-deploy-k8s.yaml
            echo "✅ Updated campaign-svc image tag"
          fi
          
          # Update lead-svc image (handles both old and new registry formats)
          if [ -f "lead-deploy-k8s.yaml" ]; then
            sed -i "s|image:.*lead-svc.*|image: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/lead-svc:${{ steps.commit.outputs.sha }}|g" lead-deploy-k8s.yaml
            echo "✅ Updated lead-svc image tag"
          fi
          
          # Update ai-svc image (handles both old and new registry formats)
          if [ -f "ai-svc-deploy-k8s.yaml" ]; then
            sed -i "s|image:.*ai-svc.*|image: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/ai-svc:${{ steps.commit.outputs.sha }}|g" ai-svc-deploy-k8s.yaml
            echo "✅ Updated ai-svc image tag"
          fi
          
          # Update frontend/outreach-ui image (handles both old and new registry formats)
          if [ -f "frontend-deploy-k8s.yaml" ]; then
            sed -i "s|image:.*outreach-ui.*|image: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/outreach-ui:${{ steps.commit.outputs.sha }}|g" frontend-deploy-k8s.yaml
            echo "✅ Updated frontend/outreach-ui image tag"
          fi
          
          echo ""
          echo "✅ All image tags updated to use commit SHA: ${{ steps.commit.outputs.sha }}"
          echo "Registry: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}"
      
      - name: Deploy all Kubernetes manifests
        run: |
          echo "📦 Deploying all Kubernetes manifests from infra/k8s/..."
          
          # Define deployment order - namespaces and configs first, then dependencies, then services
          MANIFEST_ORDER=(
            "namespace.yaml"
            "configmap.yaml"
            "postgres-deploy-k8s.yaml"
            "auth-svc-deploy-k8s.yaml"
            "lead-deploy-k8s.yaml"
            "lead-svc-k8s.yaml"
            "campaign-svc-deploy-k8s.yaml"
            "campaign-svc-k8s.yaml"
            "ai-svc-deploy-k8s.yaml"
            "ai-svc-k8s.yaml"
            "frontend-deploy-k8s.yaml"
            "frontend-svc-k8s.yaml"
            "ingress.yaml"
          )
          
          # Deploy manifests in order
          for manifest in "${MANIFEST_ORDER[@]}"; do
            if [ -f "infra/k8s/$manifest" ]; then
              echo "  → Deploying $manifest"
              kubectl apply -f infra/k8s/$manifest || echo "  ⚠️  Warning: Failed to deploy $manifest (may not exist or already deployed)"
            fi
          done
          
          # Deploy any other YAML files that weren't in the ordered list
          echo ""
          echo "📋 Deploying any remaining YAML files..."
          for file in infra/k8s/*.yaml; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              # Skip if already processed or is example/README files
              if [[ ! " ${MANIFEST_ORDER[@]} " =~ " ${filename} " ]] && [[ ! "$filename" =~ ^(secrets\.yaml\.example|README\.md|quickstart\.sh)$ ]]; then
                echo "  → Deploying additional manifest: $filename"
                kubectl apply -f "$file" || echo "  ⚠️  Warning: Failed to deploy $filename"
              fi
            fi
          done
          
          echo ""
          echo "✅ All Kubernetes manifests deployed"
      
      - name: Wait for PostgreSQL to be ready
        run: |
          echo "⏳ Waiting for PostgreSQL to be ready..."
          kubectl wait --for=condition=available --timeout=300s deployment/postgres-deployment -n deps-lead-svc || true
          sleep 10
      
      - name: Ensure imagePullSecrets are set for all deployments
        run: |
          echo "🔐 Ensuring imagePullSecrets are set for all deployments..."
          
          # Get all deployments in the namespace
          DEPLOYMENTS=$(kubectl get deployments -n deps-lead-svc -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
          
          if [ -z "$DEPLOYMENTS" ]; then
            echo "⚠️  No deployments found in namespace deps-lead-svc"
          else
            for deployment in $DEPLOYMENTS; do
              echo "  → Setting imagePullSecrets for $deployment"
              # Try to add, if it exists try to replace
              kubectl patch deployment $deployment -n deps-lead-svc --type='json' \
                -p='[{"op": "add", "path": "/spec/template/spec/imagePullSecrets", "value": [{"name": "harbor-registry-secret"}]}]' 2>/dev/null || \
              kubectl patch deployment $deployment -n deps-lead-svc --type='json' \
                -p='[{"op": "replace", "path": "/spec/template/spec/imagePullSecrets", "value": [{"name": "harbor-registry-secret"}]}]' 2>/dev/null || true
            done
          fi
      
      - name: Set imagePullPolicy to Always for all deployments
        run: |
          echo "🔄 Setting imagePullPolicy to Always for all deployments..."
          
          # Get all deployments in the namespace
          DEPLOYMENTS=$(kubectl get deployments -n deps-lead-svc -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
          
          if [ -z "$DEPLOYMENTS" ]; then
            echo "⚠️  No deployments found in namespace deps-lead-svc"
          else
            for deployment in $DEPLOYMENTS; do
              echo "  → Setting imagePullPolicy for $deployment"
              # Get number of containers and update each one
              CONTAINER_COUNT=$(kubectl get deployment $deployment -n deps-lead-svc -o jsonpath='{.spec.template.spec.containers[*].name}' | wc -w)
              for i in $(seq 0 $((CONTAINER_COUNT - 1))); do
                kubectl patch deployment $deployment -n deps-lead-svc --type='json' \
                  -p="[{\"op\": \"replace\", \"path\": \"/spec/template/spec/containers/$i/imagePullPolicy\", \"value\": \"Always\"}]" 2>/dev/null || true
              done
            done
          fi
      
      - name: Wait for all deployments to be ready
        run: |
          echo "⏳ Waiting for all deployments to be ready..."
          
          # Get all deployment names
          DEPLOYMENTS=$(kubectl get deployments -n deps-lead-svc -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
          
          if [ -z "$DEPLOYMENTS" ]; then
            echo "⚠️  No deployments found"
          else
            for deployment in $DEPLOYMENTS; do
              echo "  → Waiting for $deployment..."
              kubectl wait --for=condition=available --timeout=300s deployment/$deployment -n deps-lead-svc || echo "  ⚠️  Warning: $deployment not ready within timeout"
            done
          fi
      
      - name: Verify deployments
        run: |
          echo "=== Deployment Status ==="
          kubectl get deployments -n deps-lead-svc
          echo ""
          echo "=== Pod Status ==="
          kubectl get pods -n deps-lead-svc
          echo ""
          echo "=== Services ==="
          kubectl get services -n deps-lead-svc
      
      - name: Deployment summary
        run: |
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All container images have been deployed to GKE cluster:" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster**: \`${{ env.GKE_CLUSTER_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Namespace**: \`deps-lead-svc\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: \`${{ steps.commit.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Images from Harbor:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/auth-svc:${{ steps.commit.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/campaign-svc:${{ steps.commit.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/lead-svc:${{ steps.commit.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/ai-svc:${{ steps.commit.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/outreach-ui:${{ steps.commit.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Kubernetes Resources:" >> $GITHUB_STEP_SUMMARY
          echo "- All YAML files from \`infra/k8s/\` directory" >> $GITHUB_STEP_SUMMARY
          echo "- Namespace, ConfigMaps, Secrets, Deployments, Services, Ingress" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All Kubernetes manifests have been applied successfully." >> $GITHUB_STEP_SUMMARY

