server.port=8084
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/outreachdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# Force Hibernate to use exact column names from @Column annotations
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# AI Service Configuration
# For local development, use localhost. For Docker, use ai-svc
ai.service.url=${AI_SERVICE_URL:http://localhost:8090}

# RabbitMQ Configuration
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# RabbitMQ Queue Names
rabbitmq.lead.request.queue=${AI_LEAD_REQUEST_QUEUE:ai.email.generation.requests}
rabbitmq.lead.response.queue=${AI_LEAD_RESPONSE_QUEUE:ai.email.generation.responses}

# Public API Configuration
public.api.enabled=${PUBLIC_API_ENABLED:false}
public.api.base.url=${PUBLIC_API_BASE_URL:}
public.api.key=${PUBLIC_API_KEY:}
public.api.timeout=${PUBLIC_API_TIMEOUT:10000}