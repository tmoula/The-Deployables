plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile) {
    options.release = 17
}


repositories {
	mavenCentral()
}

dependencies {
    // REST API + server
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Request payload validation (@Valid, @NotBlank, etc.)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Monitoring endpoints (/actuator/**)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Auto-reload in development (not packaged in prod jar)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // OpenAPI + Swagger UI at /swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // RabbitMQ support
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // Database support (JPA + PostgreSQL)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'

    // Testing (JUnit, MockMvc, etc.)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacoco {
	toolVersion = "0.8.11"
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
	finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
	violationRules {
		rule {
			limit {
				minimum = 0.80 // 80% coverage required
			}
		}
	}
}

// Task to run tests and generate coverage report
task testWithCoverage {
	dependsOn test, jacocoTestReport, jacocoTestCoverageVerification
	description = 'Run tests and generate coverage report (requires 80% coverage)'
}
