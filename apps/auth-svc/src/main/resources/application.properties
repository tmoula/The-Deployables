server.port=8083
# Database configuration - can be overridden by environment variables
# For local development: use localhost
# For shared database: set DB_HOST environment variable
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:outreachdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration - IMPORTANT: Change this to a secure random string in production!
jwt.secret=your-super-secret-key-change-this-in-production-at-least-32-characters-long
jwt.expiration=86400000

# OpenAPI/Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.enabled=true