server.port=8083
# Database configuration - can be overridden by environment variables
# For local development: use localhost
# For shared database: set DB_HOST environment variable
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:outreachdb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Configuration - IMPORTANT: Change this to a secure random string in production!
jwt.secret=${JWT_SECRET:your-super-secret-key-change-this-in-production-minimum-64-chars-required}
jwt.expiration=86400000

# OpenAPI/Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.enabled=true

# Mail Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# CRITICAL: Disable mail health check so pod doesn't crash if Gmail is unreachable
management.health.mail.enabled=false