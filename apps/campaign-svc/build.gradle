plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'jacoco'
}

group = 'com.outreach'

version = '0.0.1-SNAPSHOT'
description = 'Campaign Service - Manages outreach campaigns and email automation'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile) {
    options.release = 17
}

repositories {
	mavenCentral()
}

dependencies {
    // REST API + server
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // Request payload validation (@Valid, @NotBlank, etc.)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Monitoring endpoints (/actuator/**)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Auto-reload in development (not packaged in prod jar)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // OpenAPI + Swagger UI at /swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // Testing (JUnit, MockMvc, etc.)
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    // Database support
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    
    // Email sending (JavaMail)
    implementation 'com.sun.mail:jakarta.mail:2.0.1'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    
    // Encryption support
    implementation 'org.springframework.security:spring-security-crypto'
    
    // Scheduling support
    implementation 'org.springframework.boot:spring-boot-starter'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = "0.8.11"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}


