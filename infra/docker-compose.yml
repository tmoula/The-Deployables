version: "3.9"
services:
  ui:
    build: ./frontend
    ports:
      - "5173:5173"
  
  auth-svc:
    build: ./apps/auth-svc
    ports:
      - "8083:8083"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/outreachdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
  
  lead-svc:
    build: ./apps/lead-svc
    ports:
      - "8081:8081"
    depends_on:
      - postgres
  
  user-svc:
    build: ./Backend/user-svc
    ports:
      - "8080:8080"
  
  campaign-svc:
    build: ./Backend/campaign-svc
    ports:
      - "8082:8082"
  
  ai-svc:
    build: ./AI/ai-svc
    ports:
      - "8090:8090"
  
  postgres:
    image: postgres:16
    container_name: outreach-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: outreachdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: