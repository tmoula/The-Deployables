apiVersion: apps/v1
kind: Deployment
metadata:
  name: campaign-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.campaign.replicaCount }}
  selector:
    matchLabels:
      app: campaign-svc
  template:
    metadata:
      labels:
        app: campaign-svc
    spec:
      imagePullSecrets:
{{- range .Values.imagePullSecrets }}
      - name: {{ .name | default .name | default . }}
{{- end }}
      containers:
        - name: campaign-svc
          image: "{{ .Values.campaign.image.repository }}:{{ .Values.campaign.image.tag }}"
          imagePullPolicy: {{ .Values.campaign.image.pullPolicy }}
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: outreach-config
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: outreach-secrets
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: outreach-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: outreach-config
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PORT
              valueFrom:
                configMapKeyRef:
                  name: outreach-config
                  key: RABBITMQ_PORT
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: LEAD_SERVICE_URL
              value: "http://lead-svc:8081"


