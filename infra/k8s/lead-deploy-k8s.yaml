apiVersion: apps/v1
kind: Deployment
metadata:
  name: lead-deployment
  namespace: deps-lead-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: LeadsApp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: LeadsApp
    spec:
      containers:
      - name: lead-svc
        image: lead-svc:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SERVER_PORT
          value: "8080"