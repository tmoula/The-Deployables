apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: deps-lead-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-svc
  template:
    metadata:
      labels:
        app: auth-svc
    spec:
      containers:
      - name: auth-svc
        image: harbor.javajon.duckdns.org/deps/auth-svc:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8083
        env:
        - name: DB_HOST
          value: postgres-service  # Kubernetes service name
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: outreachdb
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          value: postgres
        - name: SERVER_PORT
          value: "8083"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: deps-lead-svc
spec:
  selector:
    app: auth-svc
  ports:
  - name: http
    protocol: TCP
    port: 8083
    targetPort: 8083
  type: NodePort

