apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: deps-lead-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-svc
  template:
    metadata:
      labels:
        app: auth-svc
    spec:
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: auth-svc
        image: harbor.javajon-gke.duckdns.org/deps/auth-svc:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
        # Health probes - Kubernetes will only route traffic to healthy pods
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        env:
        # Database Configuration from ConfigMap
        - name: SPRING_DATASOURCE_URL
          valueFrom:
            configMapKeyRef:
              name: outreach-config
              key: SPRING_DATASOURCE_URL
        # Database Credentials from Secret
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: outreach-secrets
              key: SPRING_DATASOURCE_USERNAME
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: outreach-secrets
              key: SPRING_DATASOURCE_PASSWORD
        # JWT Secret from Secret
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: outreach-secrets
              key: JWT_SECRET
        # Email Configuration from Secret
        - name: MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: outreach-secrets
              key: MAIL_USERNAME
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: outreach-secrets
              key: MAIL_PASSWORD
        # Server Port from ConfigMap
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: outreach-config
              key: AUTH_SERVICE_PORT
---
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: deps-lead-svc
spec:
  selector:
    app: auth-svc
  ports:
  - name: http
    protocol: TCP
    port: 8083
    targetPort: 8083
  type: NodePort

