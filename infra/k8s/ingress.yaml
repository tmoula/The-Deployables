apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: outreach-ingress
  namespace: deps-lead-svc
  annotations:
    # Use standard nginx class
    kubernetes.io/ingress.class: nginx
spec:
  ingressClassName: nginx
  rules:
  - host: localhost
    http:
      paths:
      - path: /api/v1/auth
        pathType: Prefix
        backend:
          service:
            name: auth-svc
            port:
              number: 8083
      - path: /api/v1
        pathType: Prefix
        backend:
          service:
            name: lead-svc
            port:
              number: 8081
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-svc
            port:
              number: 80
