apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: deps-lead-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: outreach-ui
  template:
    metadata:
      labels:
        app: outreach-ui
    spec:
      containers:
      - name: outreach-ui
        image: outreach-ui:1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80