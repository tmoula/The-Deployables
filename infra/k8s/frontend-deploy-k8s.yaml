apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: deps-lead-svc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: outreach-ui
  template:
    metadata:
      labels:
        app: outreach-ui
    spec:
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: outreach-ui
        image: harbor.javajon-gke.duckdns.org/library/outreach-ui:v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        env:
        # Frontend API Configuration from ConfigMap
        - name: REACT_APP_AUTH_URL
          valueFrom:
            configMapKeyRef:
              name: outreach-config
              key: REACT_APP_AUTH_URL
        - name: REACT_APP_API_URL
          valueFrom:
            configMapKeyRef:
              name: outreach-config
              key: REACT_APP_API_URL