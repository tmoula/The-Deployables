apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-deployment
  namespace: deps-lead-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-svc
  template:
    metadata:
      labels:
        app: ai-svc
    spec:
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: ai-svc
        image: harbor.javajon-gke.duckdns.org/library/ai-svc:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 8090
        env:
        - name: PORT
          value: "8090"
        # RabbitMQ Config
        - name: RABBITMQ_HOST
          valueFrom:
            configMapKeyRef:
              name: outreach-config
              key: RABBITMQ_HOST
        - name: RABBITMQ_PORT
          valueFrom:
            configMapKeyRef:
              name: outreach-config
              key: RABBITMQ_PORT
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: outreach-secrets
              key: RABBITMQ_USER
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: outreach-secrets
              key: RABBITMQ_PASSWORD
        # Database (for persistence if needed, though mostly rabbitmq based)
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: outreach-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: outreach-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: outreach-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: outreach-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: outreach-secrets
              key: DB_PASSWORD
        # API Configuration (OpenAI as Primary, Gemini as Fallback)
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: outreach-secrets
              key: OPENAI_API_KEY
        - name: OPENAI_MODEL
          valueFrom:
            configMapKeyRef:
              name: outreach-config
              key: OPENAI_MODEL
        - name: OPENAI_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: outreach-config
              key: OPENAI_BASE_URL
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: outreach-secrets
              key: GEMINI_API_KEY
        - name: GEMINI_API_URL
          valueFrom:
            configMapKeyRef:
              name: outreach-config
              key: GEMINI_API_URL

---
apiVersion: v1
kind: Service
metadata:
  name: ai-svc
  namespace: deps-lead-svc
spec:
  selector:
    app: ai-svc
  ports:
    - protocol: TCP
      port: 8090
      targetPort: 8090
  type: ClusterIP
